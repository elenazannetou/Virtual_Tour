<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual Tour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: white;
    }

    button {
      font-size: 22px;
      padding: 16px 32px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ccc;
      transform: scale(1.05);
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.8s ease;
    }
  </style>
</head>
<body>
  <button id="enterBtn">Click to Enter</button>

  <script>
    // 👇 Your clean Chaos Cloud presentation link (no collaboration bar)
    const TOUR_URL = "https://cloud.chaos.com/present/NeEiaZ3LyBTPZbTaqtjFn7";

    const btn = document.getElementById("enterBtn");

    btn.addEventListener("click", async () => {
      // Add fade effect
      btn.classList.add("fade-out");

      // Wait a moment before redirecting (for fade animation)
      setTimeout(() => {
        // Redirect to Chaos presentation
        window.location.href = TOUR_URL;
      }, 500);

      // Attempt to trigger fullscreen before redirect (optional)
      try {
        const el = document.documentElement;
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch (err) {
        console.log("Fullscreen request ignored:", err);
      }
    });
  </script>
</body>
</html>
