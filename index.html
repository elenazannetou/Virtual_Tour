<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parko Paliatso Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #b7db57;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 1s ease forwards;
    }

    h1 {
      color: #233600;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 1.8rem;
      font-size: 1.8rem;
    }

    a.button {
      display: inline-block;
      background: #ffffff;
      color: #233600;
      text-decoration: none;
      padding: 14px 42px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    a.button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(35, 54, 0, 0.6);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Parko Paliatso Map</h1>
    <a class="button" href="https://cloud.chaos.com/collaboration/n/NeEiaZ3LyBTPZbTaqtjFn7/present?vrt=" target="_blank" rel="noopener noreferrer">
      Enter
    </a>
  </div>
  <footer>
    © 2025 Parko Paliatso — Virtual Experience
  </footer>
</body>
</html>
