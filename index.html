<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual Tour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: white;
    }
    button {
      font-size: 22px;
      padding: 16px 32px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      cursor: pointer;
    }
    button:hover {
      background: #ccc;
    }
  </style>
</head>
<body>
  <button id="enterBtn">Click to Enter</button>

  <script>
    const TOUR_URL = "https://cloud.chaos.com/collaboration/virtual-tour/NeEiaZ3LyBTPZbTaqtjFn7/present?n=6WqSa59A1QRHW4sVrfjBdH";

    document.getElementById("enterBtn").addEventListener("click", async () => {
      // Open the Chaos tour in the same tab
      window.location.href = TOUR_URL;

      // Try to enter fullscreen right after redirect (works on most phones and browsers)
      try {
        const el = document.documentElement;
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch (err) {
        console.log("Fullscreen not supported or user blocked it:", err);
      }
    });
  </script>
</body>
</html>
