<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual Tour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: white;
    }
    a.button {
      display: inline-block;
      font-size: 22px;
      padding: 16px 32px;
      border-radius: 12px;
      background: #fff;
      color: #000;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }
    a.button:active, a.button:hover {
      transform: scale(1.05);
      background: #eaeaea;
    }
  </style>
</head>
<body>
  <!-- Use a real link for maximum mobile compatibility -->
  <a id="enterLink" class="button" href="https://cloud.chaos.com/collaboration/virtual-tour/NeEiaZ3LyBTPZbTaqtjFn7/present?n=6WqSa59A1QRHW4sVrfjBdH">
    Tap to Enter
  </a>

  <script>
    // Extra fallback in case some browsers block default link behavior
    const TOUR_URL = "https://cloud.chaos.com/collaboration/virtual-tour/NeEiaZ3LyBTPZbTaqtjFn7/present?n=6WqSa59A1QRHW4sVrfjBdH";
    const linkEl = document.getElementById('enterLink');
    linkEl.addEventListener('click', function (e) {
      // Allow default <a> behavior first; but if something prevents it, force navigate:
      setTimeout(() => {
        if (document.visibilityState === 'visible') {
          // Still on this page → force navigation in same tab
          window.location.assign(TOUR_URL);
        }
      }, 50);
    });
  </script>
</body>
</html>
